# Hugo configuration for the cheat-sheets site.
# Preview:  cd site && hugo server      (see site/SITE.md)

baseURL = "https://modem7.github.io/cheat-sheets/"
locale = "en-GB"
title = "Cheat Sheets"
defaultContentLanguage = "en"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS"]

[params]
  description = "Personal homelab and DevOps cheat sheets: commands, snippets and how-tos."
  repo = "modem7/cheat-sheets"
  branch = "master"
  # Optional display names for top-level folders. Folders not listed here
  # are title-cased automatically (my-folder -> My folder).
  # Add an entry only when the automatic name is not what you want.
  [params.sectionTitles]
    cicd = "CI/CD"
    macos = "macOS"
    infra = "Infrastructure"
  # Optional one-line blurbs for the home-page section cards, keyed by folder
  # name. A folder without an entry gets an automatic line built from its
  # sheet count and first sheet titles, so adding a folder needs no config.
  [params.sectionDescriptions]
    apps = "Self-hosted apps: proxies, VPNs, monitoring and dashboards."
    backup = "Backup tools and strategies: Borg, rclone, snapshots, volumes."
    cicd = "Pipelines, runners and automation recipes."
    cloud = "Cloud concepts, provider comparisons and provider sheets."
    databases = "MariaDB, MySQL, Postgres, Redis, SQLite and SQL: queries, replication, backups."
    distros = "Container base images and the distros behind them."
    docker = "Images, containers, Compose, networking and troubleshooting."
    docs = "House style and template for writing new sheets."
    homelab = "DNS, DHCP, VLANs, reverse proxies and other home network plumbing."
    infra = "Storage and infrastructure platforms."
    kubernetes = "k3s, kubectl, k9s, DNS and cluster operations."
    linux = "Everyday Linux: files, storage, services, firewall and performance."
    macos = "Shortcuts, Homebrew and developer setup on macOS."
    misc = "Reference tables: colour codes, HTTP statuses, certificates."
    networking = "DNS, TLS, VPNs and diagnostics."
    proxmox = "Proxmox VE: storage, passthrough, firewall, cloud-init."
    recipes = "Step-by-step checklists and troubleshooting runbooks."
    scripting = "Shells, Make and linters for scripts."
    security = "Hardening, secrets, authentication and intrusion prevention."
    tools = "Command-line and developer tools, from curl to Terraform."
    windows = "Windows admin: package managers, AD, GPO, robocopy, troubleshooting."
  # Optional glyph shown beside each card's `$ man` line (any short string).
  # Missing entries fall back to a plain prompt marker.
  [params.sectionGlyphs]
    apps = "◫"
    backup = "↻"
    cicd = "⇄"
    cloud = "≈"
    databases = "≡"
    distros = "◈"
    docker = "▣"
    docs = "¶"
    homelab = "⌂"
    infra = "▥"
    kubernetes = "◎"
    linux = "$"
    macos = "⌘"
    misc = "…"
    networking = "⇆"
    proxmox = "▤"
    recipes = "§"
    scripting = "#!"
    security = "◆"
    tools = "⌥"
    windows = "▦"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # Sheets embed the occasional HTML snippet; allow it.
      unsafe = true
    [markup.goldmark.extensions]
      linkify = true
      strikethrough = true
      table = true
      taskList = true
    [markup.goldmark.parser]
      autoHeadingID = true
      autoHeadingIDType = "github"
  [markup.highlight]
    # Chroma emits CSS classes so the palette can follow the light/dark toggle
    # (assets/css/syntax.css).
    noClasses = false
    codeFences = true
    guessSyntax = false
    lineNos = false
    tabWidth = 4
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[outputs]
  home = ["HTML"]
  section = ["HTML"]
  page = ["HTML"]

[sitemap]
  changefreq = "monthly"
  priority = 0.5

# --- Content mounting ---------------------------------------------------
# scripts/prepare-content.py (run before hugo, in CI and locally) walks the
# repo, discovers every top-level folder automatically, and writes copies
# into site/.build/content with title/description front matter added. The
# sheets themselves are never modified. Hugo mounts that dir as its content
# tree, so every folder becomes a section with no config change.
[module]
  [[module.mounts]]
    source = ".build/content"
    target = "content"
  # Binary assets that sheets link to (e.g. linux/assets/awk.cheat.sheet.pdf)
  # are served from the same relative path. Exclusions ("!") must come before
  # the include globs: Hugo uses the first glob that matches.
  [[module.mounts]]
    source = ".."
    target = "static"
    files = [
      "! .*/**",
      "! site/**",
      "! node_modules/**",
      "**/assets/**",
      "**/*.pdf",
      "**/*.png",
      "**/*.jpg",
      "**/*.jpeg",
      "**/*.gif",
      "**/*.svg",
      "**/*.webp",
    ]
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
