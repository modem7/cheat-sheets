name: Lint

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 'Check wikilinks, relative links and empty files'
        run: python3 scripts/check-links.py

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 'Lint Markdown'
        uses: DavidAnson/markdownlint-cli2-action@v25.0.0
        with:
          globs: '**/*.md'
